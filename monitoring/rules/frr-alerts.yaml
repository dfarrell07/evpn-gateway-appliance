groups:
  - name: ega-frr
    rules:
      - alert: EGAFrrCollectorFailed
        expr: frrk8s_scrape_success == 0
        for: 10m
        labels:
          severity: warning
          netobserv: "true"
        annotations:
          summary: 'FRR {{ $labels.collector }} collector failed on {{ $labels.instance }}'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egafrrcollectorfailed
          netobserv_io_network_health: '{}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: {{ $labels.collector }} reads or parses failed for 10m;
            successful collection alone does not prove expected-object coverage or forwarding health.
      - alert: EGAFrrMetricsGatherErrors
        expr: >-
          increase(promhttp_metric_handler_errors_total[10m]) > 0
          and on(job, instance) frrk8s_scrape_success
        for: 10m
        labels:
          severity: warning
          netobserv: "true"
        annotations:
          summary: 'FRR metrics gather errors on {{ $labels.instance }}'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egafrrmetricsgathererrors
          netobserv_io_network_health: '{}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: the exporter failed to gather or encode some metrics
            (cause {{ $labels.cause }}), for example duplicate BFD series, so series can be missing while up and
            collector success stay 1.
      - alert: EGABgpSessionDown
        expr: frrk8s_bgp_session_up == 0
        for: 1m
        labels:
          severity: critical
          netobserv: "true"
        annotations:
          summary: 'BGP session down on {{ $labels.instance }} for {{ $labels.peer }}'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egabgpsessiondown
          netobserv_io_network_health: '{}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: peer {{ $labels.peer }} in VRF {{ $labels.vrf }}
            has not been Established for 1m; administrative shutdown also reads 0.
      - alert: EGABgpEvpnNoPrefixesAccepted
        expr: >-
          (frrk8s_bgp_family_received_prefixes{afi="l2vpn",safi="evpn"} == 0)
          and on(job, instance, peer, vrf) (frrk8s_bgp_session_up == 1)
        for: 5m
        labels:
          severity: warning
          netobserv: "true"
        annotations:
          summary: 'No accepted EVPN prefixes on {{ $labels.instance }} from {{ $labels.peer }}'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egabgpevpnnoprefixesaccepted
          netobserv_io_network_health: '{}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: Established peer {{ $labels.peer }} in VRF {{ $labels.vrf }}
            reports zero accepted l2vpn/evpn prefixes for 5m (FRR's post-policy count); routes rejected by inbound
            policy also leave it at zero. Zero may be intentional and counts do not prove propagation.
      - alert: EGAEvpnVniNoRemoteVteps
        expr: frrk8s_evpn_l2_remote_vteps == 0
        for: 15m
        labels:
          severity: warning
          netobserv: "true"
        annotations:
          summary: 'No remote VTEPs on {{ $labels.instance }} for VNI {{ $labels.vni }}'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egaevpnvninoremotevteps
          netobserv_io_network_health: '{}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: L2 VNI {{ $labels.vni }} in VRF {{ $labels.vrf }}
            has zero known remote VTEPs for 15m; zero may be intentional and this count is not reachability.
      - alert: EGABfdSessionDown
        expr: frrk8s_bfd_session_up == 0
        for: 30s
        labels:
          severity: critical
          netobserv: "true"
        annotations:
          summary: 'BFD session down on {{ $labels.instance }} for {{ $labels.peer }}'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egabfdsessiondown
          netobserv_io_network_health: '{}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: peer {{ $labels.peer }} in VRF {{ $labels.vrf }}
            reports BFD down for 30s; peer/VRF identity can collide across distinct BFD sessions.
      # Severity is warning until CORENET-7502 agrees the DF policy, including this for:
      # duration. 5m covers a takeover without BFD: FRR's default BGP hold time of 180s
      # (`frr defaults traditional`; frr-k8s also defaults to 180s) before the survivor drops
      # the dead DF's type-4 route and re-elects, plus up to 1m scrape and 1m evaluation
      # interval. It assumes BGP graceful restart is off: with it, the dead DF's routes can be
      # retained longer. A segment with no oper-up member is left to link and host alerting.
      # EGA configures no LACP bypass (`evpn mh bypass`); a segment in bypass reports no role
      # and would count as zero DFs. ESIs must be unique across everything this Prometheus
      # scrapes: the count sums every VTEP that reports the ESI. A failing es collector hides
      # that VTEP's role, so it silences a count of zero but not two reported DFs.
      - alert: EGAEvpnEsDfNotUnique
        expr: >-
          sum by (esi) (frrk8s_evpn_es_df) > 1
          or (
            sum by (esi) (frrk8s_evpn_es_df or 0 * (frrk8s_evpn_es_oper_up == 1)) == 0
            unless on(esi) (
              last_over_time(frrk8s_evpn_es_oper_up[1d])
              and on(job, instance) (frrk8s_scrape_success{collector="es"} == 0)
            )
          )
        for: 5m
        labels:
          severity: warning
          netobserv: "true"
        annotations:
          summary: 'Ethernet segment {{ $labels.esi }} has {{ $value }} designated forwarders'
          runbook_url: https://github.com/openshift/evpn-gateway-appliance/blob/main/monitoring/runbooks.md#egaevpnesdfnotunique
          netobserv_io_network_health: '{}'
          description: >-
            Ethernet segment {{ $labels.esi }} has had no DF or more than one for 5m across the VTEPs that
            report it up; it is now {{ $value }}. A VTEP that is down, holds no election result or is not scraped
            counts as non-DF; a failing es collector on a VTEP that reported the segment in the last day silences
            a count of zero.
