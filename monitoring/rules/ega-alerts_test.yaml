  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.2"}', values: 1x30}
  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.3"}', values: 1x30}
  - {series: 'frrk8s_bgp_received_prefixes_total{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1"}', values: 4x5 0x25}
  - {series: 'frrk8s_bgp_received_prefixes_total{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.2"}', values: 0x30}
  - {series: 'frrk8s_bgp_received_prefixes_total{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.3"}', values: 50x5 85x25}
