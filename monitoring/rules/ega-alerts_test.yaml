  input_series:
  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x30}
  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.2",peer_role="leaf",admin_down="false",expect_prefixes="false"}', values: 1x30}
  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.3",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x30}
