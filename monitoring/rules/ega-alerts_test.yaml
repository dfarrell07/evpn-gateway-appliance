  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="m1:9141",appliance="m1",role="onprem",site="dc1",vrf="default",peer="192.0.2.11"}', values: 1x30}
  - {series: 'frrk8s_bgp_received_prefixes_total{job="ega-frr-metrics",instance="m1:9141",appliance="m1",role="onprem",site="dc1",vrf="default",peer="192.0.2.11"}', values: 0x30}
  - {series: 'ega_expected_interface{appliance="m1",role="onprem",site="dc1",device="eth8"}', values: 1x30}
  - {series: 'node_network_info{job="ega-node-exporter",instance="m1:9100",appliance="m1",role="onprem",site="dc1",device="eth8",operstate="down"}', values: 1x30}
  - {series: 'ega_expected_target{appliance="m1",role="onprem",site="dc1",job="ega-frr-metrics"}', values: 1x30}
  - {series: 'ega_expected_target{appliance="m1",role="onprem",site="dc1",job="ega-node-exporter"}', values: 1x30}
  - {series: 'up{job="ega-frr-metrics",instance="m1:9141",appliance="m1",role="onprem",site="dc1"}', values: 1x30}
