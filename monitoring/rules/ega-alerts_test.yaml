  - {series: 'node_scrape_collector_success{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",collector="netclass"}', values: 1x20 0x10}
  - {series: 'node_scrape_collector_success{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",collector="netdev"}', values: 0x30}
  - {series: 'node_network_mtu_bytes{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="trunk.10"}', values: 1500x30}
  # trunk.10 alternates down / lowerlayerdown every minute from 5m: for: must not reset.
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="trunk.10",operstate="up"}', values: 1x4 stale}
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="trunk.10",operstate="down"}', values: _x4 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale}
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="trunk.10",operstate="lowerlayerdown"}', values: _x5 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1 stale 1x10}
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="br-vni10010",operstate="up"}', values: 1x2 stale}
  # wg0 dormant and eth9 notpresent from 0m; br-vni10010 MTU above expected.
  - {series: 'ega_expected_interface{appliance="a1",role="onprem",site="dc1",device="wg0"}', values: 1x30}
  - {series: 'ega_expected_interface{appliance="a1",role="onprem",site="dc1",device="eth9"}', values: 1x30}
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="wg0",operstate="dormant"}', values: 1x30}
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="eth9",operstate="notpresent"}', values: 1x30}
  - {series: 'ega_expected_interface_mtu_bytes{appliance="a1",device="br-vni10010"}', values: 1500x30}
  - {series: 'node_network_mtu_bytes{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",device="br-vni10010"}', values: 9000x30}
  # Another appliance has the same device names: down, and with a wrong MTU.
  - {series: 'ega_expected_interface_mtu_bytes{appliance="b1",device="trunk.10"}', values: 9000x30}
  - {series: 'node_network_info{job="ega-node-exporter",instance="b1:9100",appliance="b1",role="onprem",site="dc1",device="br-vni10010",operstate="down"}', values: 1x30}
  - {series: 'node_network_mtu_bytes{job="ega-node-exporter",instance="b1:9100",appliance="b1",role="onprem",site="dc1",device="trunk.10"}', values: 1500x30}
  # Listed collectors fail; hwmon (not listed) fails; cpu succeeds (does not gate netclass).
  - {series: 'node_scrape_collector_success{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",collector="textfile"}', values: 0x30}
  - {series: 'node_scrape_collector_success{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",collector="systemd"}', values: 0x30}
  - {series: 'node_scrape_collector_success{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",collector="hwmon"}', values: 0x30}
  - {series: 'node_scrape_collector_success{job="ega-node-exporter",instance="a1:9100",appliance="a1",role="onprem",site="dc1",collector="cpu"}', values: 1x30}
  alert_rule_test:
  - {eval_time: 1m, alertname: EGAInterfaceDown, exp_alerts: []}
  - eval_time: 3m
    alertname: EGAInterfaceDown
    exp_alerts:
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: wg0}
      exp_annotations: {summary: 'wg0 on a1 is down'}
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: eth9}
      exp_annotations: {summary: 'eth9 on a1 is down'}
  - {eval_time: 6m, alertname: EGAExpectedInterfaceMissing, exp_alerts: []}
  - eval_time: 12m
    alertname: EGAInterfaceDown
    exp_alerts:
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: wg0}
      exp_annotations: {summary: 'wg0 on a1 is down'}
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: eth9}
      exp_annotations: {summary: 'eth9 on a1 is down'}
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: trunk.10}
      exp_annotations: {summary: 'trunk.10 on a1 is down'}
  - eval_time: 12m
    alertname: EGAExpectedInterfaceMissing
    exp_alerts:
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: br-vni10010}
      exp_annotations: {summary: 'Expected interface br-vni10010 does not exist on a1'}
  - eval_time: 28m
    alertname: EGAExpectedInterfaceMissing
    exp_alerts: []
  - {eval_time: 8m, alertname: EGAInterfaceMtuMismatch, exp_alerts: []}
  - eval_time: 11m
    alertname: EGAInterfaceMtuMismatch
    exp_alerts:
    - exp_labels: {severity: warning, component: interface, appliance: a1, role: onprem, site: dc1, device: trunk.10}
      exp_annotations: {summary: 'trunk.10 on a1 has MTU 1500, not the expected value'}
    - exp_labels: {severity: warning, component: interface, appliance: a1, role: onprem, site: dc1, device: br-vni10010}
      exp_annotations: {summary: 'br-vni10010 on a1 has MTU 9000, not the expected value'}
  - {eval_time: 8m, alertname: EGANodeCollectorFailed, exp_alerts: []}
  - eval_time: 11m
    alertname: EGANodeCollectorFailed
    exp_alerts:
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: netdev}
      exp_annotations: {summary: 'node-exporter netdev collector failing on a1'}
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: textfile}
      exp_annotations: {summary: 'node-exporter textfile collector failing on a1'}
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: systemd}
      exp_annotations: {summary: 'node-exporter systemd collector failing on a1'}
  - eval_time: 32m
    alertname: EGANodeCollectorFailed
    exp_alerts:
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: netclass}
      exp_annotations: {summary: 'node-exporter netclass collector failing on a1'}
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: netdev}
      exp_annotations: {summary: 'node-exporter netdev collector failing on a1'}
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: textfile}
      exp_annotations: {summary: 'node-exporter textfile collector failing on a1'}
    - exp_labels: {severity: warning, component: node-exporter, job: ega-node-exporter, instance: "a1:9100", appliance: a1, role: onprem, site: dc1, collector: systemd}
      exp_annotations: {summary: 'node-exporter systemd collector failing on a1'}

- name: maintenance-silences-every-gated-alert
  input_series:
  # m1 is in maintenance with every failure that an inventory-gated alert detects.
  - {series: 'ega_maintenance{appliance="m1"}', values: 1x30}
  - {series: 'ega_maintenance{appliance="m2"}', values: 1x30}
  - {series: 'ega_maintenance{appliance="m3"}', values: 1x30}
  # m2: exporter scrape failing. m3: exporter up but no BGP series for its expected session.
  - {series: 'ega_expected_target{appliance="m2",role="onprem",site="dc1",job="ega-frr-metrics"}', values: 1x30}
  - {series: 'up{job="ega-frr-metrics",instance="m2:9141",appliance="m2",role="onprem",site="dc1"}', values: 0x30}
  - {series: 'ega_expected_target{appliance="m3",role="onprem",site="dc1",job="ega-frr-metrics"}', values: 1x30}
  - {series: 'up{job="ega-frr-metrics",instance="m3:9141",appliance="m3",role="onprem",site="dc1"}', values: 1x30}
