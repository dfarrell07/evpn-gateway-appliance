# Inventory rendered without admin_down: counts as not administratively down.
- name: admin-down-label-missing
  input_series:
  - {series: 'ega_expected_bgp_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.1",peer_role="leaf",expect_prefixes="true"}', values: 1x30}
  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",vrf="default",peer="192.0.2.1"}', values: 0x30}
  alert_rule_test:
  - eval_time: 15m
    alertname: EGABgpSessionDown
    exp_alerts:
    - exp_labels: {severity: critical, component: bgp, appliance: r1, role: relay, site: aws1, vrf: default, peer: 192.0.2.1, peer_role: leaf, expect_prefixes: "true"}
      exp_annotations: {summary: 'BGP session 192.0.2.1 (vrf default, leaf) on r1 not Established', description: *bgp_down}

# ega_maintenance rendered as 0 means not in maintenance, for every :active rule.
- name: maintenance-zero
  input_series:
  - {series: 'ega_maintenance{appliance="a1"}', values: 0x30}
  - {series: 'ega_expected_target{appliance="a1",role="onprem",site="dc1",job="ega-node-exporter"}', values: 1x30}
  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1",peer_role="relay",admin_down="false",expect_prefixes="false"}', values: 1x30}
  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="a1:9141",appliance="a1",vrf="default",peer="192.0.2.1"}', values: 0x30}
  - {series: 'ega_expected_bfd_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.3"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="a1:9141",appliance="a1",vrf="default",peer="192.0.2.3"}', values: 0x30}
  - {series: 'ega_expected_interface{appliance="a1",role="onprem",site="dc1",device="trunk.10"}', values: 1x30}
  - {series: 'node_network_info{job="ega-node-exporter",instance="a1:9100",appliance="a1",device="trunk.10",operstate="down"}', values: 1x30}
  alert_rule_test:
  - eval_time: 15m
    alertname: EGAInterfaceDown
    exp_alerts:
    - exp_labels: {severity: critical, component: interface, appliance: a1, role: onprem, site: dc1, device: trunk.10}
      exp_annotations: {summary: 'trunk.10 on a1 is down'}
  - eval_time: 15m
    alertname: EGAExporterTargetMissing
    exp_alerts:
    - exp_labels: {severity: warning, component: ega-node-exporter, appliance: a1, role: onprem, site: dc1, job: ega-node-exporter}
      exp_annotations: {summary: 'No ega-node-exporter target is discovered for a1', description: *target_missing}
  - eval_time: 15m
    alertname: EGABgpSessionDown
    exp_alerts:
    - exp_labels: {severity: critical, component: bgp, appliance: a1, role: onprem, site: dc1, vrf: default, peer: 192.0.2.1, peer_role: relay, admin_down: "false", expect_prefixes: "false"}
      exp_annotations: {summary: 'BGP session 192.0.2.1 (vrf default, relay) on a1 not Established', description: *bgp_down}
  - eval_time: 15m
    alertname: EGABfdSessionDown
    exp_alerts:
    - exp_labels: {severity: warning, component: bfd, appliance: a1, role: onprem, site: dc1, vrf: default, peer: 192.0.2.3}
      exp_annotations: {summary: 'BFD session 192.0.2.3 on a1 down', description: *bfd_down}

# Extrapolation turns exactly 2 OPENs (1 BFD down event) into slightly more than 2 (1):
# .1 must not alert. 3 OPENs 26-28m earlier and 2 BFD down events 9-10m earlier (.2) must.
- name: flap-threshold-extrapolation
  input_series:
  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x60}
  - {series: 'ega_expected_bfd_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1",bgp_peer="192.0.2.1"}', values: 1x60}
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="a1:9141",appliance="a1",vrf="default",peer="192.0.2.1"}', values: 1x40 2 3x20}
  - {series: 'frrk8s_bfd_session_down_events{job="ega-frr-metrics",instance="a1:9141",appliance="a1",vrf="default",peer="192.0.2.1"}', values: 3x40 4x20}
  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.2",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x60}
  - {series: 'ega_expected_bfd_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.2",bgp_peer="192.0.2.2"}', values: 1x60}
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="a1:9141",appliance="a1",vrf="default",peer="192.0.2.2"}', values: 1x21 2 3 4x38}
  - {series: 'frrk8s_bfd_session_down_events{job="ega-frr-metrics",instance="a1:9141",appliance="a1",vrf="default",peer="192.0.2.2"}', values: 0x39 1 2x21}
  alert_rule_test:
  - eval_time: 50m
    alertname: EGABgpSessionFlapping
    exp_alerts:
    - exp_labels: {severity: warning, component: bgp, job: ega-frr-metrics, instance: "a1:9141", appliance: a1, vrf: default, peer: 192.0.2.2}
      exp_annotations: {summary: 'BGP session 192.0.2.2 on a1 re-opened repeatedly', description: *bgp_flap}
  - eval_time: 50m
    alertname: EGABfdSessionFlapping
    exp_alerts:
    - exp_labels: {severity: warning, component: bfd, job: ega-frr-metrics, instance: "a1:9141", appliance: a1, vrf: default, peer: 192.0.2.2}
      exp_annotations: {summary: 'BFD session 192.0.2.2 on a1 went down repeatedly'}

# Two BFD sessions (single-hop and multihop) registered to one BGP neighbor.
- name: two-bfd-one-bgp-peer
