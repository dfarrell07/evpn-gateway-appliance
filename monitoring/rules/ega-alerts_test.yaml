  - {series: 'frrk8s_bgp_received_prefixes_total{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="red",peer="192.0.2.3"}', values: 0x30}
  alert_rule_test:
  - {eval_time: 12m, alertname: EGABgpNoPrefixesReceived, exp_alerts: []}
  - eval_time: 20m
    alertname: EGABgpNoPrefixesReceived
    exp_alerts:
    - exp_labels: {severity: warning, component: bgp, appliance: a1, role: onprem, site: dc1, vrf: default, peer: 192.0.2.1, peer_role: leaf, admin_down: "false", expect_prefixes: "true"}
      exp_annotations: {summary: 'BGP peer 192.0.2.1 on a1 is up with 0 accepted prefixes', description: &no_prefixes 'Accepted (post-policy) prefixes summed across every address family is zero. Cannot tell EVPN from IPv4 routes until per-AFI series exist.'}
  - {eval_time: 8m, alertname: EGABgpMaxPrefixNear, exp_alerts: []}
  - eval_time: 15m
    alertname: EGABgpMaxPrefixNear
    exp_alerts:
    - exp_labels: {severity: warning, component: bgp, appliance: a1, role: onprem, site: dc1, vrf: default, peer: 192.0.2.3, peer_role: leaf, admin_down: "false", expect_prefixes: "true"}
      exp_annotations: {summary: 'BGP peer 192.0.2.3 on a1 at 85% of maximum-prefix', description: &max_prefix 'Exceeding maximum-prefix tears the session down and keeps it down until "clear bgp" is run by hand.'}

