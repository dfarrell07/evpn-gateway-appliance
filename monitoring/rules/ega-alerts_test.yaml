  - {series: 'ega_expected_bgp_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.9",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x30}
  - {series: 'ega_expected_bfd_session{appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1",bgp_peer="192.0.2.1"}', values: 1x30}
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1"}', values: 5x10 0 1x20}
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.9"}', values: 1x10 2 3 4 5 6 7 7x15}
  # Flapping, but outside the inventory (another peer, appliance or VRF): no flapping alert.
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.50"}', values: 1x10 2 3 4 5 6 7 7x15}
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="x1:9141",appliance="x1",role="onprem",site="dc1",vrf="default",peer="192.0.2.9"}', values: 1x10 2 3 4 5 6 7 7x15}
  - {series: 'frrk8s_bgp_opens_received{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="red",peer="192.0.2.9"}', values: 1x10 2 3 4 5 6 7 7x15}
  - {series: 'frrk8s_bfd_session_down_events{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1"}', values: 0x10 1 2 3 3x15}
  - {series: 'frrk8s_bfd_session_down_events{job="ega-frr-metrics",instance="x1:9141",appliance="x1",role="onprem",site="dc1",vrf="default",peer="192.0.2.1"}', values: 0x10 1 2 3 3x15}
  - {series: 'frrk8s_bfd_session_down_events{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="red",peer="192.0.2.1"}', values: 0x10 1 2 3 3x15}
  - {series: 'frrk8s_bfd_session_down_events{job="ega-frr-metrics",instance="a1:9141",appliance="a1",role="onprem",site="dc1",vrf="default",peer="192.0.2.50"}', values: 0x10 1 2 3 3x15}
  alert_rule_test:
  - eval_time: 20m
    alertname: EGABgpSessionFlapping
    exp_alerts:
    - exp_labels: {severity: warning, component: bgp, job: ega-frr-metrics, instance: "a1:9141", appliance: a1, role: onprem, site: dc1, vrf: default, peer: 192.0.2.9}
      exp_annotations: {summary: 'BGP session 192.0.2.9 on a1 re-opened repeatedly', description: &bgp_flap 'OPEN messages received count session (re)establishment attempts. Sampling session_up would miss flaps shorter than the scrape interval.'}
  - eval_time: 15m
    alertname: EGABfdSessionFlapping
    exp_alerts:
    - exp_labels: {severity: warning, component: bfd, job: ega-frr-metrics, instance: "a1:9141", appliance: a1, role: onprem, site: dc1, vrf: default, peer: 192.0.2.1}
      exp_annotations: {summary: 'BFD session 192.0.2.1 on a1 went down repeatedly'}
  - eval_time: 30m
    alertname: EGABfdSessionFlapping
    exp_alerts: []

- name: bfd-bgp-correlation-and-gather-errors
  input_series:
  - {series: 'ega_expected_target{appliance="r1",role="relay",site="aws1",job="ega-frr-metrics"}', values: 1x30}
  # .1: BGP and its BFD both down (one path alert). .2: BGP down, BFD up.
  # .3: standalone BFD down. .4: registered BFD down, BGP up (no alert).
  - {series: 'ega_expected_bgp_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.1",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x30}
  - {series: 'ega_expected_bgp_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.2",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x30}
  - {series: 'ega_expected_bgp_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.4",peer_role="leaf",admin_down="false",expect_prefixes="true"}', values: 1x30}
  - {series: 'ega_expected_bfd_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.1",bgp_peer="192.0.2.1"}', values: 1x30}
  - {series: 'ega_expected_bfd_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.2",bgp_peer="192.0.2.2"}', values: 1x30}
  - {series: 'ega_expected_bfd_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.3"}', values: 1x30}
  - {series: 'ega_expected_bfd_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.4",bgp_peer="192.0.2.4"}', values: 1x30}
  - {series: 'ega_expected_bfd_session{appliance="r1",role="relay",site="aws1",vrf="red",peer="203.0.113.5"}', values: 1x30}
  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.1"}', values: 1x4 0x25}
  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.2"}', values: 1x4 0x25}
  - {series: 'frrk8s_bgp_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.4"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.1"}', values: 1x4 0x25}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.2"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.3"}', values: 1x4 0x25}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.4"}', values: 1x4 0x25}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.77"}', values: 0x30}
  - {series: 'promhttp_metric_handler_errors_total{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",cause="gathering"}', values: 0x5 1+1x10 11x15}
  # Same errors on an appliance outside the inventory: no alert.
  - {series: 'promhttp_metric_handler_errors_total{job="ega-frr-metrics",instance="x1:9141",appliance="x1",role="relay",site="aws1",cause="gathering"}', values: 0x5 1+1x10 11x15}
  # One encoding error at 26m alerts; node-exporter errors on r1 do not.
  - {series: 'promhttp_metric_handler_errors_total{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",cause="encoding"}', values: 0x25 1x5}
  - {series: 'promhttp_metric_handler_errors_total{job="ega-node-exporter",instance="r1:9100",appliance="r1",role="relay",site="aws1",cause="gathering"}', values: 0x5 1+1x10 11x15}
  # .6: standalone BFD up. r1 BFD at 203.0.113.6 (red), 203.0.113.5 (default) and x1's
  # 203.0.113.5 (red) must not hide the missing red 203.0.113.5 on r1.
  - {series: 'ega_expected_bfd_session{appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.6"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="192.0.2.6"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="red",peer="203.0.113.6"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="r1:9141",appliance="r1",role="relay",site="aws1",vrf="default",peer="203.0.113.5"}', values: 1x30}
  - {series: 'frrk8s_bfd_session_up{job="ega-frr-metrics",instance="x1:9141",appliance="x1",role="relay",site="aws1",vrf="red",peer="203.0.113.5"}', values: 1x30}
  alert_rule_test:
  - {eval_time: 8m, alertname: EGABgpDownBfdUp, exp_alerts: []}
  - {eval_time: 4m, alertname: EGABfdExpectedSessionMissing, exp_alerts: []}
  - eval_time: 12m
    alertname: EGABgpSessionDown
    exp_alerts:
    - exp_labels: {severity: critical, component: bgp, appliance: r1, role: relay, site: aws1, vrf: default, peer: 192.0.2.1, peer_role: leaf, admin_down: "false", expect_prefixes: "true"}
      exp_annotations: {summary: 'BGP session 192.0.2.1 (vrf default, leaf) on r1 not Established', description: *bgp_down}
  - eval_time: 12m
    alertname: EGABgpDownBfdUp
    exp_alerts:
    - exp_labels: {severity: warning, component: bgp, appliance: r1, role: relay, site: aws1, vrf: default, peer: 192.0.2.2, peer_role: leaf, admin_down: "false", expect_prefixes: "true"}
      exp_annotations: {summary: 'BGP 192.0.2.2 on r1 down while its BFD session is up', description: *bgp_bfd_up}
  - eval_time: 7m
    alertname: EGABfdSessionDown
    exp_alerts:
    - exp_labels: {severity: warning, component: bfd, appliance: r1, role: relay, site: aws1, vrf: default, peer: 192.0.2.3}
      exp_annotations: {summary: 'BFD session 192.0.2.3 on r1 down', description: &bfd_down 'Identity is (peer, vrf) only; a single-hop and multihop session to one peer collide. Check EGAFrrMetricsGatherErrors before trusting the value.'}
  - eval_time: 6m
    alertname: EGABfdExpectedSessionMissing
    exp_alerts:
    - exp_labels: {severity: warning, component: bfd, appliance: r1, role: relay, site: aws1, vrf: red, peer: 203.0.113.5}
      exp_annotations: {summary: 'Expected BFD session 203.0.113.5 not observed on r1', description: &bfd_missing 'Not configured, in a VRF without BGP (not discovered), or the BFD read failed. Unobservable is not healthy.'}
  - eval_time: 10m
    alertname: EGAFrrMetricsGatherErrors
    exp_alerts:
    - exp_labels: {severity: warning, component: frr-metrics, job: ega-frr-metrics, instance: "r1:9141", appliance: r1, role: relay, site: aws1, cause: gathering}
      exp_annotations: {summary: 'frr-metrics on r1 served a partial scrape (gathering)', description: &gather_errors 'Some samples were dropped by the registry. BFD values for colliding peer,vrf pairs may be wrong.'}
  - eval_time: 24m
    alertname: EGAFrrMetricsGatherErrors
    exp_alerts:
    - exp_labels: {severity: warning, component: frr-metrics, job: ega-frr-metrics, instance: "r1:9141", appliance: r1, role: relay, site: aws1, cause: gathering}
      exp_annotations: {summary: 'frr-metrics on r1 served a partial scrape (gathering)', description: *gather_errors}
  - eval_time: 29m
    alertname: EGAFrrMetricsGatherErrors
    exp_alerts:
    - exp_labels: {severity: warning, component: frr-metrics, job: ega-frr-metrics, instance: "r1:9141", appliance: r1, role: relay, site: aws1, cause: encoding}
      exp_annotations: {summary: 'frr-metrics on r1 served a partial scrape (encoding)', description: *gather_errors}

