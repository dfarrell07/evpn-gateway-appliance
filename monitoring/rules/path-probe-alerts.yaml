groups:
  - name: ega-path-probe
    rules:
      - alert: EGAEvpnPathProbeFailed
        expr: >-
          max by (job, instance) (
            (ega_path_probe_success == 0)
            and on(job, instance)
            (node_time_seconds - on(job, instance) node_textfile_mtime_seconds{file=~".*/ega-path-probe[.]prom"} <= 60)
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Overlay path probe failed on {{ $labels.instance }}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: for 5m the configured overlay probe got
            fewer than 3 echo replies within 5s. It samples one overlay path and does not
            identify the failed component.
      - alert: EGAEvpnPathProbeUnavailable
        expr: >-
          max by (job, instance) (
            (node_time_seconds - on(job, instance) node_textfile_mtime_seconds{file=~".*/ega-path-probe[.]prom"} > 60)
            or (
              node_textfile_scrape_error == 1 and on(job, instance) present_over_time(ega_path_probe_success[1d])
              unless on(job, instance) (ega_path_probe_disabled == 1)
            )
            or (
              (-1 * present_over_time(ega_path_probe_success[1d]) unless on(job, instance) ega_path_probe_success)
              and on(job, instance) node_time_seconds
              unless on(job, instance) (ega_path_probe_disabled == 1)
            )
          )
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Overlay path probe result unavailable on {{ $labels.instance }}'
          description: >-
            {{ $labels.job }}/{{ $labels.instance }}: for 5m there was no fresh probe result:
            node-exporter could not read a textfile (value 1, which can hide a failure), the
            probe textfile was older than 60s (value: its age in seconds), or the probe stopped
            reporting while node-exporter runs (value -1). Check ega-path-probe.timer and
            node-exporter's --collector.textfile.directory. Value {{ $value }}.
