---
apiVersion: appstudio.redhat.com/v1beta2
kind: IntegrationTestScenario
metadata:
  labels:
    test.appstudio.openshift.io/optional: "true"
  name: rhelai-bootc-test-cuda-aws-disk-image-x86-64
spec:
  application: rhelai-bootc
  contexts:
    - description: Component testing for bootc-cuda-aws-disk-image
      name: component_bootc-cuda-aws-disk-image
  params:
    - name: architecture
      value: "x86_64"
    - name: model-name
      value: "<model>"
    - name: pull-secret-name
      value: "<pull-secret>"
    - name: rhel-ai-version
      value: "<version>"
  resolverRef:
    params:
      - name: org
        value: <group>
      - name: repo
        value: <test-repository>
      - name: scmType
        value: gitlab
      - name: serverURL
        value: https://gitlab.com
      - name: revision
        value: main
      - name: pathInRepo
        value: pipelines/rhelai-disk-image-test.yaml
      - name: token
        value: pipelines-as-code-secret
      - name: tokenKey
        value: password
    resolver: git
    resourceKind: pipeline
