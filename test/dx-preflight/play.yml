---
# Runs evpn_aws_infra's read-only Direct Connect checks, as provisioning runs them before
# creating anything, against the fake `aws` that run.py puts first on PATH.
- name: Direct Connect preflight against a fake AWS CLI
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    tunnel:
      type: direct-connect
      mtu_mode: "{{ mtu_mode | default('safe') }}"
      onprem_ip: 10.44.44.1
      network_cidr: 10.44.44.0/24
    evpn_aws_infra_aws_region: us-west-2
    evpn_aws_infra_infra_vpc_cidr: 10.100.0.0/16
    evpn_aws_infra_workload_vpc_cidr: 10.200.0.0/16
    evpn_aws_infra_dx_gateway_id: "{{ dxgw | default('5f0e6c1e-1b1a-4c2a-9a55-0123456789ab') }}"
    evpn_aws_infra_dx_virtual_interface_ids: "{{ vifs | default(['dxvif-aaaa1111', 'dxvif-bbbb2222']) }}"
  tasks:
    - name: Run the checks provisioning runs first
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../ansible/roles/evpn_aws_infra/tasks/{{ item }}.yml"
      loop: [dx_inputs, dx_preflight]
