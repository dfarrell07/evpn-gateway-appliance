---
# Build the simulated on-prem environment (VLAN trunk + fake hosts) on the
# appliance node. Run by the e2e BEFORE network.evpn_gateway.deploy, so the
# appliance role finds the trunk/VLAN sub-interfaces it builds its VTEP on top of.
- name: Simulate the on-prem customer side
  hosts: onprem_appliances
  become: true
  roles:
    - network.evpn_gateway_test.evpn_onprem_appliance_sim
