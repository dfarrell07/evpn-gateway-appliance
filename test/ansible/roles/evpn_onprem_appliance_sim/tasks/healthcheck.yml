---
# Data-plane checks that ip-netns into the simulated VMs this role creates. Moved
# out of the product evpn_health_check role (they only make sense in the emulated
# fabric; prod has no such namespaces). Run after network.evpn_gateway.deploy.

- name: "HEALTH [onprem-sim]: Simulated VM can ping cloud gateway"
  ansible.builtin.command: >
    ip netns exec vm-{{ item.name }} ping -c 2 -W 3 {{ item.cloud_gateway }}
  changed_when: false
  loop: "{{ stretches }}"
  loop_control:
    label: "vm-{{ item.name }} → {{ item.cloud_gateway }}"

