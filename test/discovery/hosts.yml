---
# The relay alone; static.yml adds a listed workload peer. Only listed hosts are local, so a
# play that targets a discovered node fails to connect. The fake k8s_info fails when it runs
# from the relay's remote_tmp instead of the controller's.
all:
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    frr_image: quay.io/frrouting/frr:10.2.1
    infra_relay_host: relay
    stretches: []
    tunnel: {type: ipsec, onprem_ip: 10.44.44.1, cloud_ip: 10.44.44.2}
    bgp: {infra_asn: 65100, workload_asn: 65200, onprem_asn: 65000}
  children:
    cloud_infra:
      hosts:
        relay: {ansible_connection: local, ansible_remote_tmp: ~/.ansible/tmp/relay, private_ip: 10.100.0.1}
