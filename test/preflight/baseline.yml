---
# The health check's loss and RTT baseline against canned ping output (ping_out, printed by fake/ping); run by
# run.sh.
- name: Add an on-premises appliance
  hosts: first
  gather_facts: false
  tasks:
    - name: Add it
      ansible.builtin.add_host:
        name: appliance
        groups: onprem_appliances
        ansible_connection: local
        private_ip: 10.200.1.10

- name: Health check baseline
  hosts: onprem_appliances
  gather_facts: false
  environment:
    PATH: "{{ playbook_dir }}/fake:{{ lookup('env', 'PATH') }}"
    PING_OUT: "{{ ping_out }}"
  vars:
    tunnel: {onprem_ip: 10.44.44.1}
    workload_vtep_host: appliance
  tasks:
    - name: Run the baseline tasks
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../../ansible/roles/evpn_health_check"
        tasks_from: baseline
