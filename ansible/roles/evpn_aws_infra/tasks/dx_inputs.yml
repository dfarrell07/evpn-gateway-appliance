---
# direct-connect input checks, run before main.yml creates any AWS resource.
- name: Validate Direct Connect inputs
  ansible.builtin.assert:
    that:
      - evpn_aws_infra_dx_gateway_id is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - evpn_aws_infra_dx_virtual_interface_ids | length > 0
      - evpn_aws_infra_dx_virtual_interface_ids | unique | length == evpn_aws_infra_dx_virtual_interface_ids | length
      - evpn_aws_infra_dx_virtual_interface_ids | reject('match', '^dxvif-[0-9a-z]+$') | list | length == 0
    fail_msg: >-
      Set evpn_aws_infra_dx_gateway_id to the DX gateway ID and evpn_aws_infra_dx_virtual_interface_ids
      to its transit VIF IDs (dxvif-...).

# Reduced-MTU controls (MSS clamping, DF handling) are CORENET-7709; until then Direct Connect
# must carry 1550-byte packets.
- name: Require safe MTU mode for Direct Connect
  ansible.builtin.assert:
    that: tunnel.mtu_mode | default('safe') == 'safe'
    fail_msg: tunnel.type direct-connect requires tunnel.mtu_mode safe (8500-byte transit VIFs) until CORENET-7709.

- name: Read the DX gateway
  ansible.builtin.command:
    argv:
      - aws
      - directconnect
      - describe-direct-connect-gateways
      - --region
      - "{{ evpn_aws_infra_aws_region }}"
      - --direct-connect-gateway-id
      - "{{ evpn_aws_infra_dx_gateway_id }}"
      - --query
      - "directConnectGateways[].{state: directConnectGatewayState, asn: amazonSideAsn}"
      - --output
      - json
  register: _evpn_aws_infra_dx_gateway_lookup
  changed_when: false
  check_mode: false

# main.yml creates the TGW with AWS's default Amazon-side ASN, 64512; AWS refuses an association
# between gateways with the same ASN, after the VPCs and instances exist.
- name: Require an available DX gateway with an ASN other than the TGW's
  ansible.builtin.assert:
    that:
      - _evpn_aws_infra_dx_gateways | length == 1
      - _evpn_aws_infra_dx_gateways[0].state == 'available'
      - _evpn_aws_infra_dx_gateways[0].asn | int != 64512
    fail_msg: >-
      DX gateway {{ evpn_aws_infra_dx_gateway_id }} must exist, be available and use an Amazon-side ASN other than
      the TGW's 64512. Found: {{ _evpn_aws_infra_dx_gateways }}
  vars:
    _evpn_aws_infra_dx_gateways: "{{ _evpn_aws_infra_dx_gateway_lookup.stdout | from_json }}"
