---
argument_specs:
  render:
    short_description: Render and check the caller's FRR configuration before installing it.
    options:
      evpn_frr_config_template:
        type: str
        required: true
        description: Template filename relative to the calling role's templates directory.
  main:
    short_description: Reconcile a running FRR instance after configuration changes.
    options:
      evpn_frr_config_changed:
        type: bool
        default: false
        description: The rendered frr.conf changed.
      evpn_frr_daemons_changed:
        type: bool
        default: false
        description: The FRR daemon-selection file changed and requires a restart.
      evpn_frr_started_changed:
        type: bool
        default: false
        description: FRR was started by the caller during this converge.
      evpn_frr_container_name:
        type: str
        default: frr
        description: Name of the running FRR container.
      evpn_frr_container_caps:
        type: list
        elements: str
        default:
          - NET_ADMIN
          - SYS_ADMIN
          - NET_RAW
          - NET_BIND_SERVICE
          - SETUID
          - SETGID
          - KILL
          - DAC_OVERRIDE
          - CHOWN
        description: Linux capabilities used when recreating the FRR container.
