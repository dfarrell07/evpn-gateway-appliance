---
- name: Restart WireGuard
  ansible.builtin.systemd:
    name: wg-quick@wg0
    state: restarted

# On the bootc image FRR runs as its own systemd unit (the embedded image); restart that.
# Fall back to podman-direct only when the unit isn't present (non-bootc host).
- name: Restart FRR via systemd (bootc image)
  ansible.builtin.systemd:
    name: frr-container.service
    state: restarted
  when: ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services
  listen: Restart FRR

- name: Restart FRR via podman (non-bootc)
  containers.podman.podman_container:
    name: frr
    state: started
    restart: true
    image: "{{ frr_image }}"
    privileged: false
    cap_drop:
      - ALL
    cap_add: "{{ evpn_onprem_appliance_frr_container_caps }}"
    security_opt:
      - no-new-privileges
    network: host
    restart_policy: always
    volumes:
      - /etc/frr:/etc/frr:Z
      - /var/run/frr:/var/run/frr:Z
  when: not (ansible_facts.services is defined and 'frr-container.service' in ansible_facts.services)
  listen: Restart FRR

# Connection or key changes replace the appliance tunnels one at a time, keeping unrelated connections up.
# Listed after the FRR handlers so FRR already peers with any new inside addresses or ASN.
- name: Replace AWS IPsec connections
  ansible.builtin.script:
    cmd: >-
      ega_aws_tunnels.py
      --tunnel 1 {{ _evpn_onprem_appliance_ipsec_peers[0].aws_inside_ip | quote }} {{ _evpn_onprem_appliance_ipsec_peers[0].outside_ip | quote }}
      --tunnel 2 {{ _evpn_onprem_appliance_ipsec_peers[1].aws_inside_ip | quote }} {{ _evpn_onprem_appliance_ipsec_peers[1].outside_ip | quote }}
    executable: /usr/bin/python3
  changed_when: true
  # The script's waits sleep at most 315 s, plus commands bounded at 60 s each; a slow or stopped pluto or
  # FRR can still exhaust this task's overall timeout.
  timeout: 900
