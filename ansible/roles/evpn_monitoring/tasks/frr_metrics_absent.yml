---
# Stop frr-metrics and mask it so router restarts and reboots do not start it again; the bootc
# image's unit is enabled and cannot be removed. Stop before masking: a masked unit loses its
# ExecStop, which stops the exporter inside the router container. Safe when frr-metrics was
# never installed; teardown.yml runs it too.
- name: Stop frr-metrics
  ansible.builtin.systemd:
    name: frr-metrics.service
    state: stopped
  register: _evpn_monitoring_frr_metrics_stop
  failed_when:
    - _evpn_monitoring_frr_metrics_stop.failed
    - "'Could not find' not in (_evpn_monitoring_frr_metrics_stop.msg | default(''))"

# Stopping a unit that is already inactive runs no ExecStop, so an exporter left running in the
# router container would survive. Kill it like ExecStartPre does; the container may be absent.
- name: Kill an exporter left in the router container
  ansible.builtin.command: podman exec frr pkill -x frr-metrics
  register: _evpn_monitoring_frr_metrics_pkill
  changed_when: _evpn_monitoring_frr_metrics_pkill.rc == 0
  failed_when: false

- name: Mask frr-metrics
  ansible.builtin.systemd:
    name: frr-metrics.service
    masked: true

- name: Remove the legacy frr_exporter container
  containers.podman.podman_container:
    name: frr_exporter
    state: absent
