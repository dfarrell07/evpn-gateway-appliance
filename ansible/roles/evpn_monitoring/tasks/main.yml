---
# On bootc images: services are baked in, just ensure started.
# On non-bootc: deploy containers directly with shared /var/run/frr.
#
# KNOWN OPEN ITEM: both exporters use network: host with no listen-address
# binding or host firewall, so metrics are unauthenticated on every interface
# (source-audit.md §1).

- name: Ensure /var/run/frr exists on host
  ansible.builtin.file:
    path: /var/run/frr
    state: directory
    mode: "0775"
  when: monitoring.frr_exporter | default(false)

# ── frr_exporter ───────────────────────────────────────────────
- name: Start frr-exporter via systemd (bootc image)
  ansible.builtin.systemd:
    name: frr-exporter.service
    state: started
    enabled: true
  when:
    - monitoring.frr_exporter | default(false)
    - ansible_facts.services is defined
    - "'frr-exporter.service' in ansible_facts.services"
  register: _frr_exp_systemd

- name: Deploy frr_exporter via podman (non-bootc)
  containers.podman.podman_container:
    name: frr_exporter
    image: "{{ evpn_monitoring_frr_exporter_image }}"
    state: started
    restart_policy: always
    network: host
    command: >
      --collector.bgpl2vpn
      --collector.bfd
      --frr.vtysh
      --frr.vtysh.path=/usr/bin/vtysh
    volumes:
      - /etc/frr:/etc/frr:ro
      - /var/run/frr:/var/run/frr:ro
  when:
    - monitoring.frr_exporter | default(false)
    - _frr_exp_systemd is skipped

# ── node_exporter ──────────────────────────────────────────────
- name: Ensure node-exporter textfile directory exists
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    mode: "0755"
  when: monitoring.node_exporter | default(false)

- name: Start node-exporter via systemd (bootc image)
  ansible.builtin.systemd:
    name: node-exporter.service
    state: started
    enabled: true
  when:
    - monitoring.node_exporter | default(false)
    - ansible_facts.services is defined
    - "'node-exporter.service' in ansible_facts.services"
  register: _node_exp_systemd

- name: Deploy node_exporter via podman (non-bootc)
  containers.podman.podman_container:
    name: node_exporter
    image: "{{ evpn_monitoring_node_exporter_image }}"
    state: started
    restart_policy: always
    network: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/node_exporter/textfile:/var/lib/node_exporter/textfile:ro,z
    command: >
      --path.procfs=/host/proc
      --path.sysfs=/host/sys
      --path.rootfs=/rootfs
      --collector.textfile.directory=/var/lib/node_exporter/textfile
  when:
    - monitoring.node_exporter | default(false)
    - _node_exp_systemd is skipped

- name: Configure overlay path probe
  when:
    - "'onprem_appliances' in group_names"
    - monitoring.node_exporter | default(false)
    - evpn_monitoring_path_probe_target | length > 0
  block:
    # /usr is read-only on bootc; keep the script in /etc and run it through sh.
    - name: Ensure overlay path probe directory exists
      ansible.builtin.file:
        path: /etc/ega
        state: directory
        mode: "0755"

    - name: Install overlay path probe
      ansible.builtin.copy:
        src: ega-path-probe.sh
        dest: /etc/ega/ega-path-probe.sh
        mode: "0644"

    - name: Install overlay path probe units
      ansible.builtin.copy:
        dest: /etc/systemd/system/{{ item.name }}
        content: "{{ item.content }}"
        mode: "0644"
      loop:
        - name: ega-path-probe.service
          content: |
            [Unit]
            Description=EGA overlay path probe

            [Service]
            Type=oneshot
            ExecStart=/bin/sh /etc/ega/ega-path-probe.sh {{ evpn_monitoring_path_probe_target | replace('%', '%%') | quote }}
        - name: ega-path-probe.timer
          content: |
            [Unit]
            Description=Probe one EGA overlay path every 30 seconds

            [Timer]
            OnBootSec=30s
            OnUnitActiveSec=30s
            AccuracySec=1s

            [Install]
            WantedBy=timers.target
      loop_control:
        label: "{{ item.name }}"
      register: _evpn_monitoring_path_probe_units

    - name: Enable overlay path probe timer
      ansible.builtin.systemd:
        name: ega-path-probe.timer
        daemon_reload: "{{ _evpn_monitoring_path_probe_units.changed }}"
        state: started
        enabled: true
