---
argument_specs:
  main:
    short_description: Run frr-metrics, node_exporter and an optional overlay path probe for Prometheus scraping.
    description:
      - Runs frr-metrics.service, which execs the router image's /frr-metrics in the frr
        container and serves HTTPS with a self-signed certificate on 127.0.0.1:9141. The bootc
        image ships the unit; other hosts get it from this role and need frr_image to be an
        frr-rhel9 build whose frr-metrics has --disable-metrics-auth. Removes the legacy
        frr_exporter container.
      - Starts the bootc image's node-exporter unit if present, falling back to running
        node_exporter directly via Podman otherwise.
      - Optionally installs ega-path-probe.timer, which writes ega_path_probe_* metrics to
        node_exporter's textfile directory (see evpn_monitoring_path_probe_target).
    options:
      monitoring:
        type: dict
        required: true
        description: Which exporters to deploy.
        options:
          frr_exporter:
            type: bool
            default: false
            description: >-
              Run frr-metrics.service. When false, the role stops and masks it.
          node_exporter:
            type: bool
            default: false
            description: Deploy the node exporter.
      evpn_monitoring_node_exporter_image:
        type: str
        default: quay.io/prometheus/node-exporter:v1.9.1
        description: Container image for the node exporter. Pin by tag or digest.
      evpn_monitoring_path_probe_target:
        type: str
        default: ""
        description: >-
          Overlay IP address, without an IPv6 scope ID, to ping every 30s, routed only through the overlay, such as the first
          stretch's cloud_gateway. Set on onprem_appliances hosts with monitoring.node_exporter;
          when it is empty or node_exporter is off, the role removes an installed probe.
