---
argument_specs:
  main:
    short_description: Deploy frr_exporter, node_exporter and an optional overlay path probe for Prometheus scraping.
    description:
      - Starts the bootc image's baked-in systemd units if present, falling
        back to running the exporters directly via Podman otherwise.
      - Optionally installs ega-path-probe.timer, which writes ega_path_probe_* metrics to
        node_exporter's textfile directory (see evpn_monitoring_path_probe_target).
    options:
      monitoring:
        type: dict
        required: true
        description: Which exporters to deploy.
        options:
          frr_exporter:
            type: bool
            default: false
            description: Deploy the FRR exporter.
          node_exporter:
            type: bool
            default: false
            description: Deploy the node exporter.
      evpn_monitoring_frr_exporter_image:
        type: str
        default: docker.io/tynany/frr_exporter:v1.12.0
        description: Container image for the FRR exporter. Pin by tag or digest.
      evpn_monitoring_node_exporter_image:
        type: str
        default: quay.io/prometheus/node-exporter:v1.9.1
        description: Container image for the node exporter. Pin by tag or digest.
      evpn_monitoring_path_probe_target:
        type: str
        default: ""
        description: >-
          Overlay address to ping every 30s, routed only through the overlay, such as the first
          stretch's cloud_gateway. Set on onprem_appliances hosts with monitoring.node_exporter;
          clearing it does not remove an installed probe. To remove one, run systemctl disable
          --now ega-path-probe.timer, then systemctl stop ega-path-probe.service, and delete
          /var/lib/node_exporter/textfile/ega-path-probe.prom; teardown.yml does this while
          removing all EGA components.
