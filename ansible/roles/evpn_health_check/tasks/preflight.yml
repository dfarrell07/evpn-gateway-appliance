---
# Read-only transport preflight (CORENET-7501). playbooks/preflight.yml runs it, and deploy.yml
# imports that first, so a failure here blocks deployment before any host changes.

# Internet-mode transports leave a smaller inner MTU, and no MTU/MSS controls exist yet (CORENET-7709).
- name: "PREFLIGHT: Require acknowledgment of internet-mode limits"
  ansible.builtin.assert:
    that: evpn_health_check_accept_internet_mode_limits | bool
    fail_msg: >-
      tunnel.type {{ tunnel.type }} crosses the internet: workload packets above
      {{ _evpn_health_check_workload_mtu_budget[tunnel.type] }} bytes are dropped (no jumbo frames, no path MTU
      discovery, no MSS clamping until CORENET-7709), and latency and loss follow the internet path.
      {{ 'WireGuard is for development and test only. ' if tunnel.type == 'wireguard' else '' }}Set
      evpn_health_check_accept_internet_mode_limits to true to accept these limits.
  run_once: true
  when: tunnel.type in ['wireguard', 'ipsec']

- name: "PREFLIGHT: Require the workload MTU to fit the transport"
  ansible.builtin.assert:
    that: evpn_health_check_workload_mtu | int <= _evpn_health_check_workload_mtu_budget[tunnel.type]
    fail_msg: >-
      evpn_health_check_workload_mtu {{ evpn_health_check_workload_mtu }} exceeds the {{ tunnel.type }} budget of
      {{ _evpn_health_check_workload_mtu_budget[tunnel.type] }} bytes (the transport's inner MTU minus 50 bytes of VXLAN).
  run_once: true
  when: evpn_health_check_workload_mtu | int > 0
