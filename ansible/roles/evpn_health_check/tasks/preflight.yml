---
# Read-only transport preflight (CORENET-7501). playbooks/preflight.yml runs it, and deploy.yml
# imports that first, so a failure here blocks deployment before any host changes.
# The appliance's VTEP address does not exist yet, so nothing is sent from it here; health
# checks ping from it after deployment.
- name: "PREFLIGHT [onprem]: Find the Direct Connect route to the workload VTEP"
  ansible.builtin.command: ip -j route get {{ hostvars[workload_vtep_host].private_ip }}
  register: _evpn_health_check_dx_route
  changed_when: false
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'

# 1550 bytes carry VXLAN with a 1500-byte workload IP MTU (50 bytes of IPv4 VXLAN).
- name: "PREFLIGHT [onprem]: Require a 1550-byte uplink toward the workload VTEP"
  ansible.builtin.command: cat /sys/class/net/{{ (_evpn_health_check_dx_route.stdout | from_json)[0].dev }}/mtu
  register: _evpn_health_check_dx_mtu
  changed_when: false
  failed_when: _evpn_health_check_dx_mtu.rc != 0 or _evpn_health_check_dx_mtu.stdout | int < 1550
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'

- name: Check AWS Direct Connect before deployment
  delegate_to: localhost
  connection: local
  run_once: true
  become: false
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'
    - evpn_health_check_dx_telemetry | default(false) | bool
  block:
    - name: Require the control-node credential context for Direct Connect checks
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].ansible_connection | default('local') in ['local', 'ansible.builtin.local', 'ansible.legacy.local']
          - hostvars['localhost'].ansible_become | default(false) is ansible.builtin.falsy(convert_bool=true)
        fail_msg: Direct Connect checks require local execution without privilege escalation to use controller credentials.
    - name: Check the Direct Connect interfaces, association and TGW route
      ansible.builtin.include_role:
        name: evpn_aws_infra
        tasks_from: dx_status
