---
# Read-only transport preflight (CORENET-7501). provision-aws.yml runs it before creating anything,
# and deploy.yml first imports playbooks/preflight.yml, which runs it before any host changes.

# Internet-mode transports leave a smaller inner MTU, and no MTU/MSS controls exist yet (CORENET-7709).
- name: "PREFLIGHT: Require acknowledgment of internet-mode limits"
  ansible.builtin.assert:
    that: evpn_health_check_accept_internet_mode_limits | bool
    fail_msg: >-
      tunnel.type {{ tunnel.type }} crosses the internet: workload packets above
      {{ _evpn_health_check_workload_mtu_budget[tunnel.type] }} bytes are dropped (no jumbo frames, no path MTU
      discovery, no MSS clamping until CORENET-7709), and latency and loss follow the internet path.
      {{ 'WireGuard is for development and test only. ' if tunnel.type == 'wireguard' else '' }}Set
      evpn_health_check_accept_internet_mode_limits to true to accept these limits.
  run_once: true
  when: tunnel.type in ['wireguard', 'ipsec']

- name: "PREFLIGHT: Require the workload MTU to fit the transport"
  ansible.builtin.assert:
    that: evpn_health_check_workload_mtu | int <= _evpn_health_check_workload_mtu_budget[tunnel.type]
    fail_msg: >-
      evpn_health_check_workload_mtu {{ evpn_health_check_workload_mtu }} exceeds the {{ tunnel.type }} budget of
      {{ _evpn_health_check_workload_mtu_budget[tunnel.type] }} bytes (the transport's inner MTU minus 50 bytes of VXLAN).
  run_once: true
  when: evpn_health_check_workload_mtu | int > 0

# Direct Connect: the customer's network carries the underlay; the appliance needs only its VTEP and the relay.
- name: "PREFLIGHT [onprem]: Validate the Direct Connect VTEP, relay and MTU mode"
  ansible.builtin.assert:
    that:
      - tunnel.onprem_ip | ansible.utils.ipv4('address') == tunnel.onprem_ip
      - >-
        tunnel.network_cidr | default('10.44.44.0/24') | ansible.utils.ipv4('network/prefix') ==
        tunnel.network_cidr | default('10.44.44.0/24')
      - tunnel.onprem_ip | ansible.utils.ipv4(tunnel.network_cidr | default('10.44.44.0/24')) == tunnel.onprem_ip
      - hostvars[infra_relay_host].private_ip | ansible.utils.ipv4('address') == hostvars[infra_relay_host].private_ip
      # Reduced-MTU controls are CORENET-7709.
      - tunnel.mtu_mode | default('safe') == 'safe'
    fail_msg: >-
      Set tunnel.onprem_ip inside tunnel.network_cidr, a relay private IPv4 address, and tunnel.mtu_mode safe
      (required for direct-connect until CORENET-7709).
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'

# The appliance's VTEP address does not exist yet, so nothing is sent from it here; health
# checks ping from it after deployment.
- name: "PREFLIGHT [onprem]: Find the Direct Connect route to the workload VTEP"
  ansible.builtin.command: ip -j route get {{ hostvars[workload_vtep_host].private_ip }}
  register: _evpn_health_check_dx_route
  changed_when: false
  check_mode: false
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'

- name: "PREFLIGHT [onprem]: Read the uplink MTU toward the workload VTEP"
  ansible.builtin.command: cat /sys/class/net/{{ (_evpn_health_check_dx_route.stdout | from_json)[0].dev }}/mtu
  register: _evpn_health_check_dx_mtu
  changed_when: false
  check_mode: false
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'

# 1550 bytes carry VXLAN with a 1500-byte workload IP MTU (50 bytes of IPv4 VXLAN).
- name: "PREFLIGHT [onprem]: Require a 1550-byte uplink toward the workload VTEP"
  ansible.builtin.assert:
    that: _evpn_health_check_dx_mtu.stdout | int >= 1550
    fail_msg: >-
      {{ (_evpn_health_check_dx_route.stdout | from_json)[0].dev }}, the uplink toward the workload VTEP, has MTU
      {{ _evpn_health_check_dx_mtu.stdout }}; Direct Connect needs at least 1550 to carry VXLAN with a 1500-byte
      workload MTU.
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'

- name: Check AWS Direct Connect before deployment
  delegate_to: localhost
  connection: local
  run_once: true
  become: false
  when:
    - "'onprem_appliances' in group_names"
    - tunnel.type == 'direct-connect'
    - evpn_health_check_dx_telemetry | default(false) | bool
  block:
    - name: Require the control-node credential context for Direct Connect checks
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].ansible_connection | default('local') in ['local', 'ansible.builtin.local', 'ansible.legacy.local']
          - hostvars['localhost'].ansible_become | default(false) is ansible.builtin.falsy(convert_bool=true)
        fail_msg: Direct Connect checks require local execution without privilege escalation to use controller credentials.
    - name: Check the Direct Connect interfaces, association and TGW route
      ansible.builtin.include_role:
        name: evpn_aws_infra
        tasks_from: dx_status
