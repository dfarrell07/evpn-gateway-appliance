---
# FRR installs its own capability set at startup and exits if that fails, so grant
# its daemons' set plus what watchfrr needs. Mirrors image/rhel10/frr-container.service.
evpn_cloud_infra_frr_container_caps:
  - NET_ADMIN
  - SYS_ADMIN
  - NET_RAW
  - NET_BIND_SERVICE
  - SETUID
  - SETGID
  - KILL
  - DAC_OVERRIDE
  - CHOWN

# frr-k8s pod lookup for discovery; skipped when cloud_workload is already populated.
evpn_cloud_infra_frr_k8s_ns: openshift-frr-k8s
evpn_cloud_infra_frr_k8s_lbl: app=frr-k8s
