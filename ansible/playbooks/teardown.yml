---
# Remove all EVPN appliance components. Does NOT destroy cloud infrastructure.
# Usage: ansible-playbook playbooks/teardown.yml

- name: Teardown on-prem appliance
  hosts: onprem_appliances
  become: true
  tasks:
    - name: Stop overlay path probe timer and any running probe
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: "{{ false if item.endswith('.timer') else omit }}"
      loop: [ega-path-probe.timer, ega-path-probe.service]
      register: _path_probe_stop
      failed_when: _path_probe_stop.failed and 'Could not find' not in (_path_probe_stop.msg | default(''))

    - name: Remove overlay path probe files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/ega-path-probe.timer
        - /etc/systemd/system/ega-path-probe.service
        - /etc/ega
        - /var/lib/node_exporter/textfile/ega-path-probe.prom

    - name: Reload systemd after removing overlay path probe units
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Clear a failed state left by stopping an in-flight probe
      ansible.builtin.command: systemctl reset-failed ega-path-probe.service
      changed_when: false
      failed_when: false

    - name: Tear down the on-prem appliance
      ansible.builtin.include_role:
        name: evpn_onprem_appliance
        tasks_from: teardown

- name: Teardown cloud workload
  hosts: cloud_workload
  become: true
  tasks:
    - name: Stop and remove FRR container
      containers.podman.podman_container:
        name: frr
        state: absent

    - name: Remove bridges and VXLAN interfaces
      ansible.builtin.shell: |
        {% for s in stretches %}
        {% set vni = 10000 + s.vlan %}
        ip link del br-vni{{ vni }} 2>/dev/null || true
        ip link del vxlan{{ vni }} 2>/dev/null || true
        {% endfor %}
      changed_when: false

    - name: Remove FRR config
      ansible.builtin.file:
        path: /etc/frr
        state: absent

- name: Teardown cloud infra
  hosts: cloud_infra
  become: true
  tasks:
    - name: Stop and remove FRR container
      containers.podman.podman_container:
        name: frr
        state: absent

    - name: Stop WireGuard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: stopped
        enabled: false
      register: _wg_stop
      failed_when: _wg_stop.failed and 'Could not find' not in (_wg_stop.msg | default(''))

    - name: Remove FRR config
      ansible.builtin.file:
        path: /etc/frr
        state: absent
