---
# Full deploy — idempotent, safe to re-run.
# Usage: ansible-playbook playbooks/deploy.yml

- name: Check and load the IPsec handoff
  hosts: onprem_appliances
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # Before any host changes: IPsec and Direct Connect share one VTEP address and relay peering, so they
    # serve one appliance; multihoming (CORENET-7502) is not supported with them.
    - name: Require one appliance without multihoming for IPsec and Direct Connect
      ansible.builtin.assert:
        that:
          - groups['onprem_appliances'] | length == 1
          - not (multihoming.enabled | default(false) | bool)
        fail_msg: tunnel.type {{ tunnel.type }} supports one on-premises appliance without multihoming.
      run_once: true
      when: tunnel.type != 'wireguard'

    - name: Load missing IPsec handoff from AWS
      delegate_to: localhost
      connection: local
      run_once: true
      become: false
      when:
        - tunnel.type == 'ipsec'
        - evpn_onprem_appliance_ipsec is undefined
      block:
        - name: Require the control-node credential context for VPN handoff
          ansible.builtin.assert:
            that:
              - hostvars['localhost'].ansible_connection | default('local') in ['local', 'ansible.builtin.local', 'ansible.legacy.local']
              - hostvars['localhost'].ansible_become | default(false) is ansible.builtin.falsy(convert_bool=true)
            fail_msg: VPN handoff requires local execution without privilege escalation to use controller credentials.
        - name: Read existing project VPN handoff
          ansible.builtin.include_role:
            name: evpn_aws_infra
            tasks_from: vpn_handoff

    - name: Pass AWS VPN handoff to the appliance in memory
      ansible.builtin.set_fact:
        evpn_onprem_appliance_ipsec: "{{ evpn_aws_infra_vpn }}"
      when:
        - tunnel.type == 'ipsec'
        - evpn_onprem_appliance_ipsec is not defined
      no_log: true

- name: Deploy cloud infra (EVPN relay + WireGuard)
  hosts: cloud_infra
  become: true
  pre_tasks:
    # Needed so ansible_facts.services is populated for the roles' systemd-vs-podman branch (source-audit.md, "Missing service facts").
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_infra
    - evpn_monitoring

- name: Deploy cloud workload (EVPN VTEP)
  hosts: cloud_workload
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_cloud_workload
    - evpn_monitoring

- name: Deploy on-prem appliance (EVPN VTEP + VLAN trunk)
  hosts: onprem_appliances
  become: true
  pre_tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:
  roles:
    - evpn_onprem_appliance
    - evpn_monitoring

- name: Wait for EVPN convergence
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Wait 15 seconds for BGP EVPN to converge
      ansible.builtin.pause:
        seconds: 15

- name: Health checks
  hosts: all
  become: true
  roles:
    - evpn_health_check
